plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hycalendar.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hycalendar.app'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.4.0'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
