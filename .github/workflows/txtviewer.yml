name: Build TXT Viewer

on:
  push:
    branches: [ main ]
    paths: [ 'txtviewer/**', '.github/workflows/txtviewer.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: txtviewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish txtviewer-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VC=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk txtviewer.apk
          gh release delete txtviewer-latest --yes --cleanup-tag || true
          gh release create txtviewer-latest txtviewer.apk --title "TXT뷰어 최신 빌드" --notes "커밋 ${GITHUB_SHA::7} · v${VN} · code ${VC}" --target "$GITHUB_SHA" --latest=false
          sleep 3
          gh release edit txtviewer-latest --draft=false --latest=false
          gh release view txtviewer-latest --json isDraft --jq '.isDraft' | grep -q false
