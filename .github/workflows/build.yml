name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'txtviewer/**', '.github/workflows/txtviewer.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Firebase 설정 파일 (있을 때만)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hycalendar-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VC=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk hycalendar.apk
          gh release delete latest --yes --cleanup-tag || true
          { echo "커밋 ${GITHUB_SHA::7} · v${VN} · code ${VC}"; echo; cat CHANGES.txt 2>/dev/null || true; } > "$RUNNER_TEMP/notes.txt"
          gh release create latest hycalendar.apk --title "최신 빌드" --notes-file "$RUNNER_TEMP/notes.txt" --target "$GITHUB_SHA"
          # 릴리스가 임시저장(draft)으로 남으면 앱이 못 찾으므로 공개로 전환
          sleep 3
          gh release edit latest --draft=false --latest
          gh release view latest --json isDraft --jq '.isDraft' | grep -q false
