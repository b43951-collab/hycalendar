name: Build beta APK

# 시험용(beta) 빌드: beta 브랜치에 올리면 'beta' 태그(시험 릴리스)로만 게시한다.
# 사용자 앱의 자동 업데이트는 'latest'만 보므로 영향이 없다. 개발자 폰만 "시험 버전 받기"를 켜서 받는다.

on:
  push:
    branches: [ beta ]
    paths-ignore: [ 'txtviewer/**', '.github/workflows/txtviewer.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Firebase 설정 파일 (있을 때만)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 교체 서명 (서명 키 비밀값이 등록돼 있을 때만)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk hycalendar.apk
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "서명 키 비밀값이 없어서 옛 서명 그대로 사용"; exit 0; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/new.p12"
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage" \
            --old-signer --ks app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --new-signer --ks "$RUNNER_TEMP/new.p12" --ks-key-alias hycal --ks-pass env:KS_PASS --key-pass env:KS_PASS
          # 첫 서명자=옛 키(안드로이드 8 이하용 v2), 다음 서명자=새 키(v3, 옛 키가 새 키로 바꿔도 된다는 증명서 포함)
          "$BT/apksigner" sign --lineage "$RUNNER_TEMP/lineage" \
            --ks app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --next-signer \
            --ks "$RUNNER_TEMP/new.p12" --ks-key-alias hycal --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out signed.apk app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify -v --print-certs signed.apk | tee verify.txt
          grep -q "v3 scheme (APK Signature Scheme v3): true" verify.txt
          mv signed.apk hycalendar.apk
          rm -f "$RUNNER_TEMP/new.p12"
          echo "교체 서명 완료"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hycalendar-debug
          path: hycalendar.apk

      - name: Publish beta release (시험용, 모두에게 나가지 않음)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VC=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          gh release delete beta --yes --cleanup-tag || true
          gh release create beta hycalendar.apk --prerelease --title "시험 빌드" --notes "시험용 · 커밋 ${GITHUB_SHA::7} · v${VN} · code ${VC}" --target "$GITHUB_SHA"
          sleep 3
          gh release edit beta --draft=false --prerelease
          gh api repos/${GITHUB_REPOSITORY}/releases/tags/beta --jq '.draft' | grep -q false
