name: Build beta APK

# 시험용(beta) 빌드: beta 브랜치에 올리면 'beta' 태그(시험 릴리스)로만 게시한다.
# 사용자 앱의 자동 업데이트는 'latest'만 보므로 영향이 없다. 개발자 폰만 "시험 버전 받기"를 켜서 받는다.

on:
  push:
    branches: [ beta ]
    paths-ignore: [ 'txtviewer/**', '.github/workflows/txtviewer.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Firebase 설정 파일 (있을 때만)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hycalendar-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish beta release (시험용, 모두에게 나가지 않음)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VC=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk hycalendar.apk
          gh release delete beta --yes --cleanup-tag || true
          gh release create beta hycalendar.apk --prerelease --title "시험 빌드" --notes "시험용 · 커밋 ${GITHUB_SHA::7} · v${VN} · code ${VC}" --target "$GITHUB_SHA"
          sleep 3
          gh release edit beta --draft=false --prerelease
          gh api repos/${GITHUB_REPOSITORY}/releases/tags/beta --jq '.draft' | grep -q false
