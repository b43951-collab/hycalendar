plugins {
    id 'com.android.application'
}

android {
    namespace 'com.txtviewer.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.txtviewer.app'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '0.5.1'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
